map $arg_v $asset_cache_control {
    ""      "no-cache, must-revalidate";
    default "public, max-age=31536000, immutable";
}

server {
    listen       80;
    server_name  localhost;

    root   /usr/share/nginx/html;
    index  index.html;

    # Block access to hidden files/dirs (e.g. .git) and internal deploy/server files
    location ~ /\.(?!well-known) {
        deny all;
    }
    location ~ ^/(deploy|nginx|smu_logo)(/|$) {
        deny all;
    }
    location ~ ^/(docker-compose\.yaml|serve\.py)$ {
        deny all;
    }

    # Extensionless .html URLs; always revalidate HTML
    location / {
        try_files $uri $uri/ $uri.html =404;
        add_header Cache-Control "no-cache, must-revalidate" always;

        # Inject ?v=<hash> into styles.css and script.js when generated by deploy.sh
        sub_filter_once off;
        include /etc/nginx/conf.d/asset-versions*.inc;
    }

    # Static assets: immutable when versioned (?v=...), otherwise revalidate via ETag
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|mp4|webm)$ {
        add_header Cache-Control $asset_cache_control always;
    }
}
